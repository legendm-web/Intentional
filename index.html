<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intentional - Purify</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo" onclick="location.reload()">Intentional</div>
        <div class="search-container">
            <input id="q" placeholder="Search without distractions..." onkeydown="if (event.key === 'Enter') doSearch()" />
            <button onclick="doSearch()">🔍</button>
        </div>
        <div class="user-actions">
            <button onclick="localStorage.clear(); location.reload();">Reset Engine</button>
        </div>
    </header>

    <main class="content">
        <div id="purify-player-container" style="display:none;">
            <div class="video-wrapper">
                <iframe id="purify-iframe" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
            <div class="player-bar">
                <button onclick="closePlayer()">✕ Close Player</button>
            </div>
        </div>

        <h2 id="section-title">Recommended</h2>
        <div id="results" class="video-grid"></div>
    </main>

    <script src="js/state.js"></script>
    <script src="js/search.js"></script>
    <script>
        window.onload = () => { if (typeof loadRecommendations === "function") loadRecommendations(); };
        async function doSearch() {
            const q = document.getElementById("q").value.trim();
            if (!q) return;
            document.getElementById("section-title").innerText = "Search Results";
            document.getElementById("results").innerHTML = "Searching...";
            const vids = await searchAll(q);
            renderResults(vids);
        }
    </script>
</body>
</html>
