<!DOCTYPE html>
<html>
<head>
  <title>Intentional</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>What do you want to watch?</h1>
  <p class="subtitle">Nothing plays unless you choose it.</p>

  <input id="q" placeholder="Search..." onkeydown="if (event.key === 'Enter') doSearch()" />
  <button onclick="doSearch()">Search</button>
  
  <div id="search-history" style="margin-top: 10px; display: flex; gap: 8px;"></div>
  
  <div id="status-bar" style="margin: 10px 0; font-size: 0.8rem; display: flex; gap: 15px;">
    <span id="status-piped">Piped: ⚪</span>
    <span id="status-invidious">Invidious: ⚪</span>
    <span id="status-odysee">Odysee: ⚪</span>
  </div>

  <div id="results"></div> <script src="js/state.js"></script>
  <script src="js/rank.js"></script>
  <script src="js/search.js"></script>

  <script>
    async function doSearch() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;

  const resultsEl = document.getElementById("results");
  resultsEl.innerHTML = "<p>Connecting to proxy...</p>";

  try {
    // Check if the function exists before calling it
    if (typeof window.searchAll === "function") {
      const vids = await window.searchAll(q);
      window.renderResults(vids);
    } else {
      resultsEl.innerHTML = "<p style='color:red;'>Error: Search script failed to load. Check console.</p>";
    }
  } catch (e) {
    console.error("Search execution failed:", e);
  }
}
  </script>
</body>
</html>
