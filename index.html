<!DOCTYPE html>
<html>
<head>
    <title>Intentional Player</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <h1>Intentional</h1>
    <p class="subtitle">Search, click, and watch without distractions.</p>

    <div id="purify-player-container" style="display:none; max-width: 900px; margin: 0 auto 30px auto;">
        <div class="video-wrapper">
            <iframe id="purify-iframe" src="" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="player-controls" style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
            <button onclick="closePlayer()" style="background: #444;">✕ Close Player</button>
            <button id="download-btn" style="background: #cc0000;">⬇ Get Download Link</button>
        </div>
    </div>

    <div class="search-box">
        <input id="q" placeholder="Search for videos..." onkeydown="if (event.key === 'Enter') doSearch()" />
        <button onclick="doSearch()">Search</button>
    </div>
    
    <div id="status-bar" style="margin: 10px 0; font-size: 0.8rem; display: flex; gap: 15px; justify-content: center; color: #666;">
        <span id="status-piped">YouTube: ⚪</span>
        <span id="status-odysee">Odysee: ⚪</span>
    </div>

    <div id="results"></div> 

    <script src="js/state.js"></script>
    <script src="js/search.js"></script>

    <script>
        async function doSearch() {
            const q = document.getElementById("q").value.trim();
            if (!q) return;
            const resultsEl = document.getElementById("results");
            resultsEl.innerHTML = "<p>Searching...</p>";

            if (typeof window.searchAll === "function") {
                const vids = await window.searchAll(q);
                window.renderResults(vids);
            }
        }
    </script>
</body>
</html>
