<!DOCTYPE html>
<html>
<head>
  <title>Intentional</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>What do you want to watch?</h1>
  <p class="subtitle">Nothing plays unless you choose it.</p>

  <input
    id="q"
    placeholder="Search YouTube & LBRY"
    onkeydown="if (event.key === 'Enter') doSearch()"
  />

  <button onclick="doSearch()">Search</button>
<div id="search-history" style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;"></div>
  <div id="results"></div>

  <!-- JS FILES (ORDER MATTERS) -->
  <script src="js/state.js"></script>
  <script src="js/rank.js"></script>
  <script src="js/search.js"></script>
  
<div id="status-bar" style="margin: 10px 0; font-size: 0.85rem; color: #555; display: flex; gap: 15px;">
    <span id="status-piped">Piped: ⚪</span>
    <span id="status-invidious">Invidious: ⚪</span>
    <span id="status-odysee">Odysee: ⚪</span>
</div>
  
<div id="results"></div>
  <!-- INLINE GLUE CODE -->
  <script>
    async function doSearch() {
      const q = document.getElementById("q").value.trim();
      if (!q) return;

      console.log("Searching for:", q);

      try {
        const vids = await searchAll(q);
        console.log("Results:", vids);
        renderResults(vids);
      } catch (e) {
        console.error("Search failed:", e);
      }
    }
  </script>
</body>
</html>
