<!DOCTYPE html>
<html>
<head>
    <title>Playing Video</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 12px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="window.history.back()">← Back to Search</button>
    </div>

    <h2 id="video-title">Loading...</h2>

    <div class="video-container">
        <iframe id="main-player" src="" allowfullscreen></iframe>
    </div>

    <script src="js/state.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
